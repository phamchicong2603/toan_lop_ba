<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SGK Bài 2: Phép cộng, trừ phạm vi 1.000</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #bfdbfe 0%, #93c5fd 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .game-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 480px;
      padding: 22px 18px;
      text-align: center;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-back {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.88rem;
      font-weight: bold;
      color: #475569;
      text-decoration: none;
    }
    .stat-text { font-size: 1rem; font-weight: bold; color: #1e293b; }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.25s ease;
    }
    .question-box {
      background: #eff6ff;
      border: 2px dashed #3b82f6;
      border-radius: 18px;
      padding: 18px 14px;
      margin-bottom: 14px;
      text-align: left;
    }
    .q-type { font-size: 0.85rem; font-weight: 800; color: #1d4ed8; margin-bottom: 6px; }
    .q-content { font-size: 1.15rem; line-height: 1.5; font-weight: 700; color: #1e293b; margin: 0; }
    .hint-box {
      min-height: 48px;
      font-size: 0.9rem;
      color: #1e40af;
      background: #dbeafe;
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: left;
    }
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 10px;
    }
    .btn-opt {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 8px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e40af;
      transition: transform 0.05s;
    }
    .btn-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 #1e40af; }
    .btn-opt.correct { background: #10b981 !important; box-shadow: 0 4px 0 #047857 !important; }
    .btn-opt.disabled { background: #cbd5e1 !important; box-shadow: 0 4px 0 #94a3b8 !important; opacity: 0.6; cursor: not-allowed; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="game-card">
  <div id="quiz-section">
    <div class="header-bar">
      <a href="sgk_chude1.html" class="btn-back">⬅ Chọn bài khác</a>
      <span class="stat-text" id="lbl-score">⭐ Điểm: 0</span>
      <span class="stat-text" id="lbl-lives">❤️ Lượt: 3</span>
    </div>

    <div class="progress-track">
      <div class="progress-bar" id="bar-progress"></div>
    </div>

    <div class="question-box">
      <div class="q-type" id="lbl-qtype">DẠNG TOÁN SGK</div>
      <p class="q-content" id="lbl-qcontent"></p>
    </div>

    <div class="hint-box" id="lbl-hint">Bé hãy tính nhẩm hoặc đặt tính cẩn thận nhé!</div>
    <div class="answers-grid" id="grid-answers"></div>
  </div>

  <div id="end-section" class="hidden">
    <h2 id="lbl-end-title" style="font-size: 1.6rem; margin-bottom: 8px;">🎉 XUẤT SẮC! 🎉</h2>
    <p id="lbl-end-msg" style="font-size: 1.1rem; color: #475569; margin-bottom: 24px;"></p>
    <div style="display: flex; gap: 12px;">
      <a href="sgk_chude1.html" class="btn-opt" style="flex: 1; background: #64748b; box-shadow: 0 4px 0 #475569; text-decoration: none; display: flex; align-items: center; justify-content: center;">Chọn bài</a>
      <button class="btn-opt" style="flex: 1;" onclick="location.reload()">Luyện lại</button>
    </div>
  </div>
</div>

<script>
  function generateLesson2Questions(total = 20) {
    const list = [];
    for (let i = 0; i < total; i++) {
      const type = i % 4;
      let qType, content, correct, hint;
      const wrongs = new Set();

      if (type === 0) {
        // DẠNG 1: Tính nhẩm số tròn trăm (SGK Trang 9)
        const isPlus = Math.random() > 0.5;
        if (isPlus) {
          const a = (Math.floor(Math.random() * 5) + 1) * 100;
          const b = (Math.floor(Math.random() * 4) + 1) * 100;
          const res = a + b;
          qType = "DẠNG 1: TÍNH NHẨM TRÒN TRĂM";
          content = `Tính nhẩm: ${a} + ${b} = ?`;
          correct = `${res}`;
          hint = `Nhẩm: ${a/100} trăm + ${b/100} trăm = ${res/100} trăm (${res}).`;
          wrongs.add(`${res + 100}`); wrongs.add(`${res - 100}`); wrongs.add(`${res + 10}`);
        } else {
          const res = (Math.floor(Math.random() * 4) + 2) * 100;
          const b = (Math.floor(Math.random() * 3) + 1) * 100;
          const a = res + b;
          qType = "DẠNG 1: TÍNH NHẨM TRÒN TRĂM";
          content = `Tính nhẩm: ${a} - ${b} = ?`;
          correct = `${res}`;
          hint = `Nhẩm: ${a/100} trăm - ${b/100} trăm = ${res/100} trăm (${res}).`;
          wrongs.add(`${res + 100}`); wrongs.add(`${res - 100}`); wrongs.add(`${res + 50}`);
        }
      }
      else if (type === 1) {
        // DẠNG 2: Cộng có nhớ trong phạm vi 1.000 (SGK Trang 9)
        const a = Math.floor(Math.random() * 300) + 120;
        const b = Math.floor(Math.random() * 200) + 130;
        const res = a + b;
        qType = "DẠNG 2: PHÉP CỘNG CÓ NHỚ";
        content = `Đặt tính rồi tính: ${a} + ${b} = ?`;
        correct = `${res}`;
        hint = `Cộng lần lượt từ phải sang trái: hàng đơn vị, hàng chục (nhớ 1) rồi đến hàng trăm.`;
        wrongs.add(`${res - 10}`); wrongs.add(`${res + 10}`); wrongs.add(`${res + 100}`);
      }
      else if (type === 2) {
        // DẠNG 3: Trừ có nhớ trong phạm vi 1.000 (SGK Trang 10)
        const b = Math.floor(Math.random() * 250) + 120;
        const res = Math.floor(Math.random() * 300) + 110;
        const a = b + res;
        qType = "DẠNG 3: PHÉP TRỪ CÓ NHỚ";
        content = `Đặt tính rồi tính: ${a} - ${b} = ?`;
        correct = `${res}`;
        hint = `Trừ lần lượt từ hàng đơn vị sang trái, nhớ mượn 1 chục ở hàng bên cạnh nếu số bị trừ nhỏ hơn.`;
        wrongs.add(`${res + 10}`); wrongs.add(`${res - 10}`); wrongs.add(`${res + 100}`);
      }
      else {
        // DẠNG 4: Bài toán có lời văn (SGK Trang 9, 10)
        const buffalo = (Math.floor(Math.random() * 4) + 5) * 100 + 50; // 550 - 850 kg
        const calf = (Math.floor(Math.random() * 2) + 1) * 100 + 50;    // 150 - 250 kg
        const diff = buffalo - calf;
        qType = "DẠNG 4: TOÁN LỜI VĂN THỰC TẾ";
        content = `Con trâu nặng ${buffalo} kg, con nghé nặng ${calf} kg. Hỏi con trâu nặng hơn con nghé bao nhiêu kg?`;
        correct = `${diff} kg`;
        hint = `Lấy cân nặng con trâu trừ đi con nghé: ${buffalo} - ${calf} = ${diff} kg.`;
        wrongs.add(`${buffalo + calf} kg`); wrongs.add(`${diff + 100} kg`); wrongs.add(`${diff - 50} kg`);
      }

      const finalWrongs = Array.from(wrongs).filter(w => w !== correct).slice(0, 3);
      while (finalWrongs.length < 3) {
        finalWrongs.push(`${Math.floor(Math.random() * 500) + 100}`);
      }

      list.push({
        type: qType,
        content: content,
        correct: correct,
        wrongs: finalWrongs,
        hint: hint
      });
    }
    return list;
  }

  const questions = generateLesson2Questions(20);
  let currentIndex = 0;
  let score = 0;
  let lives = 3;

  function updateStatus() {
    document.getElementById('lbl-score').innerText = `⭐ Điểm: ${score}`;
    document.getElementById('lbl-lives').innerText = `❤️ Lượt: ${lives}`;
    const percent = (currentIndex / questions.length) * 100;
    document.getElementById('bar-progress').style.width = `${percent}%`;
  }

  function renderQuestion() {
    if (currentIndex >= questions.length) {
      endGame(true);
      return;
    }
    const q = questions[currentIndex];
    document.getElementById('lbl-qtype').innerText = `${q.type} (CÂU ${currentIndex + 1}/20)`;
    document.getElementById('lbl-qcontent').innerText = q.content;
    document.getElementById('lbl-hint').innerText = "Bé hãy tính nhẩm hoặc đặt tính cẩn thận nhé!";

    const container = document.getElementById('grid-answers');
    container.innerHTML = "";

    const options = [q.correct, ...q.wrongs].sort(() => Math.random() - 0.5);
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt';
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(btn, opt === q.correct);
      container.appendChild(btn);
    });
  }

  function checkAnswer(btn, isCorrect) {
    const q = questions[currentIndex];
    if (isCorrect) {
      btn.classList.add('correct');
      score += 10;
      updateStatus();
      Array.from(document.getElementsByClassName('btn-opt')).forEach(b => b.onclick = null);

      setTimeout(() => {
        currentIndex++;
        updateStatus();
        renderQuestion();
      }, 550);
    } else {
      btn.classList.add('disabled');
      btn.onclick = null;
      lives--;
      updateStatus();
      document.getElementById('lbl-hint').innerText = "💡 Hướng dẫn: " + q.hint;
      if (lives <= 0) endGame(false);
    }
  }

  function endGame(isWin) {
    document.getElementById('quiz-section').classList.add('hidden');
    document.getElementById('end-section').classList.remove('hidden');
    const title = document.getElementById('lbl-end-title');
    const msg = document.getElementById('lbl-end-msg');

    if (isWin) {
      title.innerText = "🎉 XUẤT SẮC! 🎉";
      title.style.color = "#10b981";
      msg.innerText = `Bé đã làm đúng tất cả 20 câu Bài 2 với ${score} điểm!`;
    } else {
      title.innerText = "CỐ GẮNG LẦN SAU NHÉ! 💪";
      title.style.color = "#ef4444";
      msg.innerText = `Bé đã vượt qua ${currentIndex}/${questions.length} câu với ${score} điểm.`;
    }
  }

  updateStatus();
  renderQuestion();
</script>
</body>
</html>
