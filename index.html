<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Toán Vui Lớp 3 - Trang Chủ</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #c7d2fe 0%, #bae6fd 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .main-box {
      background: white;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 440px;
      padding: 26px 20px;
      text-align: center;
    }
    h1 { color: #1e3a8a; font-size: 1.7rem; margin: 0 0 6px 0; }
    p.sub { color: #64748b; font-size: 0.95rem; margin-bottom: 22px; }
    
    .list-topics { display: flex; flex-direction: column; gap: 14px; }
    
    /* Thẻ liên kết chuyển trang */
    .topic-link {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s;
    }
    .topic-link:active { transform: scale(0.98); background: #eff6ff; }
    .topic-link.active-link { border-color: #3b82f6; }
    .icon { font-size: 2.2rem; }
    .info { text-align: left; }
    .info h3 { margin: 0 0 4px 0; color: #0f172a; font-size: 1.05rem; }
    .info p { margin: 0 0 6px 0; font-size: 0.85rem; color: #64748b; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      background: #dbeafe;
      color: #1d4ed8;
    }
    .locked { opacity: 0.55; pointer-events: none; }
  </style>
</head>
<body>

<div class="main-box">
  <h1>🌟 Vui Học Toán Lớp 3 🌟</h1>
  <p class="sub">Bé hãy chọn chủ đề để bắt đầu nhé!</p>

  <div class="list-topics">
    <!-- Bấm vào đây sẽ mở trực tiếp trang chude1.html -->
    <a href="chude1.html" class="topic-link active-link">
      <div class="icon">🎯</div>
      <div class="info">
        <h3>Chủ đề 1: Cộng, Trừ trong phạm vi 20</h3>
        <p>Luyện tập 20 câu ngẫu nhiên không trùng lặp.</p>
        <span class="badge">Đang mở • Tự động sinh đề</span>
      </div>
    </a>

    <div class="topic-link locked">
      <div class="icon">✖️️</div>
      <div class="info">
        <h3>Chủ đề 2: Bảng nhân 2 đến 9</h3>
        <p>Sẽ thêm trang chude2.html tiếp theo.</p>
        <span class="badge" style="background: #f1f5f9; color: #94a3b8;">Chưa mở</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
