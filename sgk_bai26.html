<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SGK Bài 26: Chia số có hai chữ số cho số có một chữ số</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body {
      margin: 0; background: linear-gradient(180deg, #e0e7ff 0%, #c7d2fe 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px;
    }
    .game-card {
      background: white; border-radius: 24px; box-shadow: 0 14px 35px rgba(0,0,0,0.15);
      width: 100%; max-width: 480px; padding: 22px 18px; text-align: center;
    }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-back {
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px;
      padding: 6px 12px; font-size: 0.88rem; font-weight: bold; color: #475569; text-decoration: none;
    }
    .stat-text { font-size: 1rem; font-weight: bold; color: #1e293b; }
    .progress-track { width: 100%; height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
    .progress-bar { height: 100%; width: 0%; background: #4f46e5; transition: width 0.25s ease; }
    .question-box {
      background: #eef2ff; border: 2px dashed #4f46e5; border-radius: 18px;
      padding: 18px 14px; margin-bottom: 14px; text-align: left;
    }
    .q-type { font-size: 0.85rem; font-weight: 800; color: #4338ca; margin-bottom: 6px; }
    .q-content { font-size: 1.15rem; line-height: 1.5; font-weight: 700; color: #1e293b; margin: 0; }
    .hint-box {
      min-height: 48px; font-size: 0.9rem; color: #3730a3; background: #e0e7ff;
      border-radius: 12px; padding: 8px 12px; margin-bottom: 16px; display: flex;
      align-items: center; justify-content: center; text-align: left;
    }
    .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
    .btn-opt {
      background: #4f46e5; color: white; border: none; border-radius: 14px;
      padding: 16px 8px; font-size: 1.15rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 0 #3730a3; transition: transform 0.05s;
    }
    .btn-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 #3730a3; }
    .btn-opt.correct { background: #16a34a !important; box-shadow: 0 4px 0 #15803d !important; }
    .btn-opt.disabled { background: #cbd5e1 !important; box-shadow: 0 4px 0 #94a3b8 !important; opacity: 0.6; cursor: not-allowed; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="game-card">
  <div id="quiz-section">
    <div class="header-bar">
      <a href="sgk_chude4.html" class="btn-back">⬅ Chọn bài khác</a>
      <span class="stat-text" id="lbl-score">⭐ Điểm: 0</span>
      <span class="stat-text" id="lbl-lives">❤️ Lượt: 3</span>
    </div>

    <div class="progress-track"><div class="progress-bar" id="bar-progress"></div></div>

    <div class="question-box">
      <div class="q-type" id="lbl-qtype">DẠNG TOÁN SGK</div>
      <p class="q-content" id="lbl-qcontent"></p>
    </div>

    <div class="hint-box" id="lbl-hint">Bé hãy chia lần lượt từng chữ số từ trái sang phải nhé!</div>
    <div class="answers-grid" id="grid-answers"></div>
  </div>

  <div id="end-section" class="hidden">
    <h2 id="lbl-end-title" style="font-size: 1.6rem; margin-bottom: 8px;">🎉 XUẤT SẮC! 🎉</h2>
    <p id="lbl-end-msg" style="font-size: 1.1rem; color: #475569; margin-bottom: 24px;"></p>
    <div style="display: flex; gap: 12px;">
      <a href="sgk_chude4.html" class="btn-opt" style="flex: 1; background: #64748b; box-shadow: 0 4px 0 #475569; text-decoration: none; display: flex; align-items: center; justify-content: center;">Chọn bài</a>
      <button class="btn-opt" style="flex: 1;" onclick="location.reload()">Luyện lại</button>
    </div>
  </div>
</div>

<script>
  function generateLesson26Questions(total = 20) {
    const list = [];
    for (let i = 0; i < total; i++) {
      const type = i % 4;
      let qType, content, correct, hint;
      const wrongs = new Set();

      if (type === 0) {
        // Phép chia hết số có 2 chữ số (SGK Trang 75)
        const divisor = [2, 3, 4][Math.floor(Math.random() * 3)];
        const quotient = Math.floor(Math.random() * 15) + 12; // 12 - 26
        const dividend = divisor * quotient;
        qType = "DẠNG 1: CHIA HẾT SỐ CÓ HAI CHỮ SỐ";
        content = `Đặt tính rồi tính: ${dividend} : ${divisor} = ?`;
        correct = `${quotient}`;
        hint = `Chia từng hàng từ trái sang phải: hàng chục chia trước, rồi hạ hàng đơn vị xuống chia tiếp.`;
        wrongs.add(`${quotient + 2}`); wrongs.add(`${quotient - 2}`); wrongs.add(`${quotient + 10}`);
      }
      else if (type === 1) {
        // Tính nhẩm tròn chục chia 1 chữ số (SGK Trang 76 Bài 2)
        const tens = [60, 80, 90][Math.floor(Math.random() * 3)];
        const div = tens === 90 ? 3 : 2;
        const res = tens / div;
        qType = "DẠNG 2: TÍNH NHẨM TRÒN CHỤC";
        content = `Tính nhẩm: ${tens} : ${div} = ?`;
        correct = `${res}`;
        hint = `Nhẩm: ${tens / 10} chục : ${div} = ${res / 10} chục (${res}).`;
        wrongs.add(`${res + 10}`); wrongs.add(`${res - 10}`); wrongs.add(`${res + 5}`);
      }
      else if (type === 2) {
        // Chia có dư số có 2 chữ số (SGK Trang 76)
        const divisor = 3;
        const quotient = Math.floor(Math.random() * 10) + 14;
        const rem = Math.floor(Math.random() * 2) + 1; // dư 1 hoặc 2
        const dividend = divisor * quotient + rem;
        qType = "DẠNG 3: PHÉP CHIA CÓ DƯ";
        content = `Thực hiện phép chia: ${dividend} : ${divisor} = ?`;
        correct = `${quotient} (dư ${rem})`;
        hint = `${divisor} × ${quotient} = ${divisor * quotient}; ${dividend} - ${divisor * quotient} = ${rem}.`;
        wrongs.add(`${quotient} (dư 0)`);
        wrongs.add(`${quotient + 1} (dư ${rem})`);
        wrongs.add(`${quotient - 1} (dư 1)`);
      }
      else {
        // Bài toán chia trứng gà / xếp bàn học (SGK Trang 77, 78)
        const eggs = (Math.floor(Math.random() * 6) + 15) * 3; // 45 - 60
        qType = "DẠNG 4: TOÁN LỜI VĂN BÀI TOÁN CHIA";
        content = `Bác Hoa có ${eggs} quả trứng gà chia đều vào 3 rổ. Hỏi mỗi rổ có bao nhiêu quả trứng gà?`;
        correct = `${eggs / 3} quả`;
        hint = `Phép chia: ${eggs} : 3 = ${eggs / 3} quả trứng gà.`;
        wrongs.add(`${eggs / 3 + 2} quả`); wrongs.add(`${eggs / 3 - 2} quả`); wrongs.add(`${eggs / 3 + 10} quả`);
      }

      const finalWrongs = Array.from(wrongs).filter(w => w !== correct).slice(0, 3);
      while (finalWrongs.length < 3) finalWrongs.push(`${Math.floor(Math.random() * 30) + 10}`);

      list.push({ type: qType, content: content, correct: correct, wrongs: finalWrongs, hint: hint });
    }
    return list;
  }

  const questions = generateLesson26Questions(20);
  let currentIndex = 0; let score = 0; let lives = 3;

  function updateStatus() {
    document.getElementById('lbl-score').innerText = `⭐ Điểm: ${score}`;
    document.getElementById('lbl-lives').innerText = `❤️ Lượt: ${lives}`;
    document.getElementById('bar-progress').style.width = `${(currentIndex / questions.length) * 100}%`;
  }

  function renderQuestion() {
    if (currentIndex >= questions.length) { endGame(true); return; }
    const q = questions[currentIndex];
    document.getElementById('lbl-qtype').innerText = `${q.type} (CÂU ${currentIndex + 1}/20)`;
    document.getElementById('lbl-qcontent').innerText = q.content;
    document.getElementById('lbl-hint').innerText = "Bé hãy suy nghĩ kỹ nhé!";

    const container = document.getElementById('grid-answers');
    container.innerHTML = "";
    const options = [q.correct, ...q.wrongs].sort(() => Math.random() - 0.5);
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt'; btn.innerText = opt;
      btn.onclick = () => checkAnswer(btn, opt === q.correct);
      container.appendChild(btn);
    });
  }

  function checkAnswer(btn, isCorrect) {
    const q = questions[currentIndex];
    if (isCorrect) {
      btn.classList.add('correct'); score += 10; updateStatus();
      Array.from(document.getElementsByClassName('btn-opt')).forEach(b => b.onclick = null);
      setTimeout(() => { currentIndex++; updateStatus(); renderQuestion(); }, 550);
    } else {
      btn.classList.add('disabled'); btn.onclick = null; lives--; updateStatus();
      document.getElementById('lbl-hint').innerText = "💡 Hướng dẫn: " + q.hint;
      if (lives <= 0) endGame(false);
    }
  }

  function endGame(isWin) {
    document.getElementById('quiz-section').classList.add('hidden');
    document.getElementById('end-section').classList.remove('hidden');
    const title = document.getElementById('lbl-end-title');
    const msg = document.getElementById('lbl-end-msg');
    if (isWin) {
      title.innerText = "🎉 XUẤT SẮC! 🎉"; title.style.color = "#4f46e5";
      msg.innerText = `Bé đã làm đúng tất cả 20 câu Bài 26 với ${score} điểm!`;
    } else {
      title.innerText = "CỐ GẮNG LẦN SAU NHÉ! 💪"; title.style.color = "#ef4444";
      msg.innerText = `Bé đã vượt qua ${currentIndex}/${questions.length} câu với ${score} điểm.`;
    }
  }

  updateStatus(); renderQuestion();
</script>
</body>
</html>
