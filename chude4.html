<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chủ đề 4: Gấp Lên Nhiều Lần, Giảm Đi Nhiều Lần</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #fbcfe8 0%, #f472b6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .game-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 480px;
      padding: 22px 18px;
      text-align: center;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-home {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #475569;
      text-decoration: none;
    }
    .stat-text { font-size: 1rem; font-weight: bold; color: #1e293b; }
    
    .progress-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #ec4899;
      transition: width 0.25s ease;
    }

    .question-box {
      background: #fdf2f8;
      border: 2px dashed #ec4899;
      border-radius: 18px;
      padding: 16px 14px;
      margin-bottom: 14px;
      text-align: left;
    }
    .q-number {
      font-size: 0.9rem;
      font-weight: 800;
      color: #be185d;
      margin-bottom: 6px;
    }
    .q-content {
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 600;
      color: #1e293b;
      margin: 0;
    }

    .hint-box {
      min-height: 48px;
      font-size: 0.9rem;
      color: #9d174d;
      background: #fce7f3;
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: left;
    }

    .answers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-opt {
      background: #f43f5e;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #be123c;
      transition: transform 0.05s;
      text-align: center;
    }
    .btn-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 #be123c; }
    .btn-opt.correct { background: #10b981 !important; box-shadow: 0 4px 0 #047857 !important; }
    .btn-opt.disabled { background: #cbd5e1 !important; box-shadow: 0 4px 0 #94a3b8 !important; opacity: 0.6; cursor: not-allowed; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="game-card">

  <div id="quiz-section">
    <div class="header-bar">
      <a href="index.html" class="btn-home">🏠 Trang chủ</a>
      <span class="stat-text" id="lbl-score">⭐ Điểm: 0</span>
      <span class="stat-text" id="lbl-lives">❤️ Lượt: 3</span>
    </div>

    <div class="progress-track">
      <div class="progress-bar" id="bar-progress"></div>
    </div>

    <div class="question-box">
      <div class="q-number" id="lbl-qnum">BÀI TẬP 1</div>
      <p class="q-content" id="lbl-qcontent"></p>
    </div>

    <div class="hint-box" id="lbl-hint">Bé hãy đọc kỹ câu hỏi và tính nhẩm từng bước nhé!</div>

    <div class="answers-list" id="answers-container"></div>
  </div>

  <div id="end-section" class="hidden">
    <h2 id="lbl-end-title" style="font-size: 1.6rem; margin-bottom: 8px;">🎉 XUẤT SẮC! 🎉</h2>
    <p id="lbl-end-msg" style="font-size: 1.1rem; color: #475569; margin-bottom: 24px;"></p>
    <div style="display: flex; gap: 12px;">
      <a href="index.html" class="btn-opt" style="flex: 1; background: #64748b; box-shadow: 0 4px 0 #475569; text-decoration: none; display: flex; align-items: center; justify-content: center;">Trang chủ</a>
      <button class="btn-opt" style="flex: 1;" onclick="location.reload()">Luyện lại</button>
    </div>
  </div>

</div>

<script>
  // DỮ LIỆU ĐẦY ĐỦ 12 BÀI TOÁN TỪ PHIẾU CỦA CÔ TRỊNH THỊ CHIẾN
  const questionsData = [
    {
      content: "Năm nay con 7 tuổi, tuổi bố gấp 5 lần tuổi con. Hỏi 3 năm nữa bố bao nhiêu tuổi?",
      correct: "38 tuổi",
      wrongs: ["35 tuổi", "40 tuổi", "32 tuổi"],
      hint: "Bước 1: Tính tuổi bố hiện nay: 7 × 5 = 35 (tuổi). Bước 2: Ba năm nữa tuổi bố là: 35 + 3 = 38 (tuổi)."
    },
    {
      content: "Năm nay con 7 tuổi, tuổi bố gấp 5 lần tuổi con. Hỏi trước đây 5 năm bố bao nhiêu tuổi?",
      correct: "30 tuổi",
      wrongs: ["35 tuổi", "25 tuổi", "32 tuổi"],
      hint: "Bước 1: Tuổi bố hiện nay là: 7 × 5 = 35 (tuổi). Bước 2: Năm năm trước tuổi bố là: 35 - 5 = 30 (tuổi)."
    },
    {
      content: "Con hái được 8 quả cam, mẹ hái được số cam gấp 5 lần con. Hỏi cả hai mẹ con hái được bao nhiêu quả cam?",
      correct: "48 quả cam",
      wrongs: ["40 quả cam", "45 quả cam", "50 quả cam"],
      hint: "Bước 1: Số cam mẹ hái: 8 × 5 = 40 (quả). Bước 2: Cả hai mẹ con: 8 + 40 = 48 (quả)."
    },
    {
      content: "Túi thứ nhất đựng 8 kg gạo bằng 1/3 túi thứ hai. Hỏi túi thứ hai đựng nhiều hơn túi thứ nhất bao nhiêu kilôgam gạo?",
      correct: "16 kg gạo",
      wrongs: ["24 kg gạo", "8 kg gạo", "12 kg gạo"],
      hint: "Bước 1: Túi 2 gấp 3 lần túi 1: 8 × 3 = 24 (kg). Bước 2: Nhiều hơn số kg là: 24 - 8 = 16 (kg)."
    },
    {
      content: "Có hai thùng dầu, thùng thứ nhất có 26 lít dầu, thùng thứ hai có số dầu gấp 3 lần số dầu của thùng thứ nhất. Hỏi 2 thùng có tất cả bao nhiêu lít dầu?",
      correct: "104 lít dầu",
      wrongs: ["78 lít dầu", "102 lít dầu", "94 lít dầu"],
      hint: "Bước 1: Thùng 2 có: 26 × 3 = 78 (lít). Bước 2: Cả hai thùng có: 26 + 78 = 104 (lít)."
    },
    {
      content: "Một cửa hàng ngày thứ nhất bán được 48kg đường, ngày thứ hai giảm đi so với ngày thứ nhất 2 lần. Hỏi ngày thứ hai bán được bao nhiêu kg đường?",
      correct: "24 kg đường",
      wrongs: ["22 kg đường", "46 kg đường", "96 kg đường"],
      hint: "Giảm đi 2 lần tức là chia cho 2. Phép tính: 48 : 2 = 24 (kg)."
    },
    {
      content: "Lan có 45 con tem, Lan có số tem gấp 3 lần số tem của Thắm. Hỏi hai bạn có tất cả bao nhiêu con tem?",
      correct: "60 con tem",
      wrongs: ["15 con tem", "75 con tem", "135 con tem"],
      hint: "Bước 1: Số tem của Thắm là: 45 : 3 = 15 (con tem). Bước 2: Cả 2 bạn có: 45 + 15 = 60 (con tem)."
    },
    {
      content: "Ngày thứ hai nhà máy sản xuất được 48 đôi giầy, ngày thứ hai sản xuất giảm 4 lần so với ngày thứ nhất. Hỏi ngày thứ hai sản xuất ít hơn ngày thứ nhất bao nhiêu đôi giầy?",
      correct: "144 đôi giầy",
      wrongs: ["192 đôi giầy", "36 đôi giầy", "12 đôi giầy"],
      hint: "Ngày thứ nhất gấp 4 lần ngày hai: 48 × 4 = 192. Ngày hai ít hơn ngày một: 192 - 48 = 144 (đôi giầy)."
    },
    {
      content: "Có hai thùng dầu, thùng thứ nhất có 46 lít dầu. Thùng thứ hai nếu thêm 16 lít thì sẽ gấp đôi thùng thứ nhất. Hỏi thùng thứ hai có bao nhiêu lít dầu?",
      correct: "76 lít dầu",
      wrongs: ["92 lít dầu", "108 lít dầu", "60 lít dầu"],
      hint: "Bước 1: Số dầu thùng 2 khi thêm: 46 × 2 = 92 (lít). Bước 2: Thùng 2 ban đầu có: 92 - 16 = 76 (lít)."
    },
    {
      content: "Một cửa hàng ngày thứ nhất bán được 42 chiếc xe đạp, ngày thứ hai bán giảm 3 lần so với ngày thứ nhất. Hỏi ngày thứ hai cửa hàng bán ít hơn ngày thứ nhất bao nhiêu chiếc xe đạp?",
      correct: "28 chiếc xe đạp",
      wrongs: ["14 chiếc xe đạp", "30 chiếc xe đạp", "39 chiếc xe đạp"],
      hint: "Bước 1: Ngày 2 bán: 42 : 3 = 14 (chiếc). Bước 2: Ngày 2 ít hơn ngày 1: 42 - 14 = 28 (chiếc)."
    },
    {
      content: "Có hai thùng nước mắm, thùng thứ nhất có 36 chai. Thùng thứ hai nếu bớt ra 6 chai thì số còn lại kém thùng thứ nhất 2 lần. Hỏi thùng thứ hai có bao nhiêu chai nước mắm?",
      correct: "24 chai",
      wrongs: ["18 chai", "12 chai", "30 chai"],
      hint: "Bước 1: Số mắm kém 2 lần là: 36 : 2 = 18 (chai). Bước 2: Thùng 2 ban đầu có: 18 + 6 = 24 (chai)."
    },
    {
      content: "Có hai hộp kẹo, hộp thứ nhất có 12 viên kẹo, hộp thứ hai có số kẹo gấp 3 lần hộp thứ nhất. Hỏi phải chuyển từ hộp thứ hai sang hộp thứ nhất bao nhiêu viên để hai hộp bằng nhau?",
      correct: "12 viên kẹo",
      wrongs: ["24 viên kẹo", "6 viên kẹo", "18 viên kẹo"],
      hint: "Hộp 2 có: 12 × 3 = 36. Hiệu số kẹo: 36 - 12 = 24. Cần chuyển: 24 : 2 = 12 (viên)."
    }
  ];

  // Xáo trộn thứ tự các câu hỏi để mỗi lần luyện tập đều mới lạ
  const questions = [...questionsData].sort(() => Math.random() - 0.5);
  let currentIndex = 0;
  let score = 0;
  let lives = 3;

  function updateStatus() {
    document.getElementById('lbl-score').innerText = `⭐ Điểm: ${score}`;
    document.getElementById('lbl-lives').innerText = `❤️ Lượt: ${lives}`;
    const percent = (currentIndex / questions.length) * 100;
    document.getElementById('bar-progress').style.width = `${percent}%`;
  }

  function renderQuestion() {
    if (currentIndex >= questions.length) {
      endGame(true);
      return;
    }

    const q = questions[currentIndex];
    document.getElementById('lbl-qnum').innerText = `BÀI TẬP ${currentIndex + 1} / ${questions.length}`;
    document.getElementById('lbl-qcontent').innerText = q.content;
    document.getElementById('lbl-hint').innerText = "Bé hãy đọc kỹ câu hỏi và tính nhẩm từng bước nhé!";

    const container = document.getElementById('answers-container');
    container.innerHTML = "";

    const options = [q.correct, ...q.wrongs].sort(() => Math.random() - 0.5);
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt';
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(btn, opt === q.correct);
      container.appendChild(btn);
    });
  }

  function checkAnswer(btn, isCorrect) {
    const q = questions[currentIndex];
    if (isCorrect) {
      btn.classList.add('correct');
      score += 10;
      updateStatus();
      Array.from(document.getElementsByClassName('btn-opt')).forEach(b => b.onclick = null);

      setTimeout(() => {
        currentIndex++;
        updateStatus();
        renderQuestion();
      }, 600);
    } else {
      btn.classList.add('disabled');
      btn.onclick = null;
      lives--;
      updateStatus();
      document.getElementById('lbl-hint').innerText = "💡 Hướng dẫn: " + q.hint;

      if (lives <= 0) {
        endGame(false);
      }
    }
  }

  function endGame(isWin) {
    document.getElementById('quiz-section').classList.add('hidden');
    document.getElementById('end-section').classList.remove('hidden');
    const title = document.getElementById('lbl-end-title');
    const msg = document.getElementById('lbl-end-msg');

    if (isWin) {
      title.innerText = "🎉 XUẤT SẮC! 🎉";
      title.style.color = "#10b981";
      msg.innerText = `Bé đã giải đúng toàn bộ 12 bài toán lời văn với ${score} điểm!`;
    } else {
      title.innerText = "CỐ GẮNG LẦN SAU NHÉ! 💪";
      title.style.color = "#ef4444";
      msg.innerText = `Bé đã hoàn thành ${currentIndex}/${questions.length} bài toán với ${score} điểm.`;
    }
  }

  updateStatus();
  renderQuestion();
</script>
</body>
</html>
