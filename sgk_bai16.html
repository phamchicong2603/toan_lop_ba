<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SGK Bài 16: Điểm ở giữa, Trung điểm của đoạn thẳng</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body {
      margin: 0; background: linear-gradient(180deg, #bae6fd 0%, #7dd3fc 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px;
    }
    .game-card {
      background: white; border-radius: 24px; box-shadow: 0 14px 35px rgba(0,0,0,0.15);
      width: 100%; max-width: 480px; padding: 22px 18px; text-align: center;
    }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-back {
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px;
      padding: 6px 12px; font-size: 0.88rem; font-weight: bold; color: #475569; text-decoration: none;
    }
    .stat-text { font-size: 1rem; font-weight: bold; color: #1e293b; }
    .progress-track { width: 100%; height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
    .progress-bar { height: 100%; width: 0%; background: #0284c7; transition: width 0.25s ease; }
    .question-box {
      background: #f0f9ff; border: 2px dashed #0284c7; border-radius: 18px;
      padding: 18px 14px; margin-bottom: 14px; text-align: left;
    }
    .q-type { font-size: 0.85rem; font-weight: 800; color: #0369a1; margin-bottom: 6px; }
    .q-content { font-size: 1.15rem; line-height: 1.5; font-weight: 700; color: #1e293b; margin: 0; }
    .hint-box {
      min-height: 48px; font-size: 0.9rem; color: #075985; background: #e0f2fe;
      border-radius: 12px; padding: 8px 12px; margin-bottom: 16px; display: flex;
      align-items: center; justify-content: center; text-align: left;
    }
    .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
    .btn-opt {
      background: #0284c7; color: white; border: none; border-radius: 14px;
      padding: 16px 8px; font-size: 1.12rem; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 0 #0369a1; transition: transform 0.05s;
    }
    .btn-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 #0369a1; }
    .btn-opt.correct { background: #16a34a !important; box-shadow: 0 4px 0 #15803d !important; }
    .btn-opt.disabled { background: #cbd5e1 !important; box-shadow: 0 4px 0 #94a3b8 !important; opacity: 0.6; cursor: not-allowed; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="game-card">
  <div id="quiz-section">
    <div class="header-bar">
      <a href="sgk_chude3.html" class="btn-back">⬅ Chọn bài khác</a>
      <span class="stat-text" id="lbl-score">⭐ Điểm: 0</span>
      <span class="stat-text" id="lbl-lives">❤️ Lượt: 3</span>
    </div>

    <div class="progress-track"><div class="progress-bar" id="bar-progress"></div></div>

    <div class="question-box">
      <div class="q-type" id="lbl-qtype">DẠNG TOÁN SGK</div>
      <p class="q-content" id="lbl-qcontent"></p>
    </div>

    <div class="hint-box" id="lbl-hint">Bé hãy nhớ: Trung điểm phải ở giữa và chia đoạn thẳng thành 2 phần bằng nhau!</div>
    <div class="answers-grid" id="grid-answers"></div>
  </div>

  <div id="end-section" class="hidden">
    <h2 id="lbl-end-title" style="font-size: 1.6rem; margin-bottom: 8px;">🎉 XUẤT SẮC! 🎉</h2>
    <p id="lbl-end-msg" style="font-size: 1.1rem; color: #475569; margin-bottom: 24px;"></p>
    <div style="display: flex; gap: 12px;">
      <a href="sgk_chude3.html" class="btn-opt" style="flex: 1; background: #64748b; box-shadow: 0 4px 0 #475569; text-decoration: none; display: flex; align-items: center; justify-content: center;">Chọn bài</a>
      <button class="btn-opt" style="flex: 1;" onclick="location.reload()">Luyện lại</button>
    </div>
  </div>
</div>

<script>
  function generateLesson16Questions(total = 20) {
    const list = [];
    for (let i = 0; i < total; i++) {
      const type = i % 4;
      let qType, content, correct, hint;
      const wrongs = new Set();

      if (type === 0) {
        // Khái niệm trung điểm đoạn thẳng (SGK Trang 49)
        const d = (Math.floor(Math.random() * 8) + 2) * 2; // độ dài chẵn: 4, 6, 8, ...
        const half = d / 2;
        qType = "DẠNG 1: TÍNH ĐỘ DÀI TRUNG ĐIỂM";
        content = `Đoạn thẳng AB dài ${d} cm. Điểm M là trung điểm của AB. Độ dài đoạn thẳng AM bằng bao nhiêu?`;
        correct = `${half} cm`;
        hint = `Trung điểm chia đoạn thẳng thành 2 nửa bằng nhau: ${d} : 2 = ${half} cm.`;
        wrongs.add(`${half + 2} cm`); wrongs.add(`${half - 1} cm`); wrongs.add(`${d} cm`);
      }
      else if (type === 1) {
        // Điểm ở giữa vs Trung điểm (SGK Trang 49, 50)
        const a = Math.floor(Math.random() * 4) + 2;
        const b = a + 2; // hai đoạn không bằng nhau
        qType = "DẠNG 2: PHÂN BIỆT ĐIỂM Ở GIỮA VÀ TRUNG ĐIỂM";
        content = `Ba điểm A, B, C thẳng hàng. Biết AB = ${a} cm, BC = ${b} cm. Điểm B có phải là trung điểm của AC không?`;
        correct = "Không phải";
        hint = `Điểm B ở giữa A và C nhưng AB khác BC (${a} cm khác ${b} cm) nên B không phải là trung điểm.`;
        wrongs.add("Đúng là trung điểm"); wrongs.add("Bằng trung điểm"); wrongs.add("Không xác định được");
      }
      else if (type === 2) {
        // Cắt dây bằng nhau không dùng thước (SGK Trang 51 Bài 4)
        const len = (Math.floor(Math.random() * 3) + 2) * 10; // 20, 30, 40 cm
        qType = "DẠNG 3: THỰC HÀNH TÌM TRUNG ĐIỂM";
        content = `Có một sợi dây dài ${len} cm. Không dùng thước đo, làm thế nào để lấy được một đoạn dài ${len / 2} cm?`;
        correct = "Gập đôi sợi dây lại rồi cắt";
        hint = `Gập đôi sợi dây sao cho hai đầu trùng nhau, nếp gấp chính là trung điểm chia sợi dây thành 2 đoạn bằng ${len / 2} cm.`;
        wrongs.add("Cắt ước lượng"); wrongs.add("Gập làm 3 phần"); wrongs.add("Không cắt được");
      }
      else {
        // Tìm độ dài đoạn thẳng khi biết nửa đoạn (SGK Trang 49, 50)
        const half = Math.floor(Math.random() * 8) + 3;
        qType = "DẠNG 4: TÌM ĐỘ DÀI ĐOẠN THẲNG BAN ĐẦU";
        content = `Điểm I là trung điểm của đoạn thẳng MN. Biết MI = ${half} cm. Độ dài đoạn MN là:`;
        correct = `${half * 2} cm`;
        hint = `MN dài gấp đôi MI: ${half} × 2 = ${half * 2} cm.`;
        wrongs.add(`${half} cm`); wrongs.add(`${half * 2 + 2} cm`); wrongs.add(`${half + 2} cm`);
      }

      const finalWrongs = Array.from(wrongs).filter(w => w !== correct).slice(0, 3);
      while (finalWrongs.length < 3) finalWrongs.push(`${Math.floor(Math.random() * 20) + 1} cm`);

      list.push({ type: qType, content: content, correct: correct, wrongs: finalWrongs, hint: hint });
    }
    return list;
  }

  const questions = generateLesson16Questions(20);
  let currentIndex = 0; let score = 0; let lives = 3;

  function updateStatus() {
    document.getElementById('lbl-score').innerText = `⭐ Điểm: ${score}`;
    document.getElementById('lbl-lives').innerText = `❤️️ Lượt: ${lives}`;
    document.getElementById('bar-progress').style.width = `${(currentIndex / questions.length) * 100}%`;
  }

  function renderQuestion() {
    if (currentIndex >= questions.length) { endGame(true); return; }
    const q = questions[currentIndex];
    document.getElementById('lbl-qtype').innerText = `${q.type} (CÂU ${currentIndex + 1}/20)`;
    document.getElementById('lbl-qcontent').innerText = q.content;
    document.getElementById('lbl-hint').innerText = "Bé hãy suy nghĩ kỹ nhé!";

    const container = document.getElementById('grid-answers');
    container.innerHTML = "";
    const options = [q.correct, ...q.wrongs].sort(() => Math.random() - 0.5);
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt'; btn.innerText = opt;
      btn.onclick = () => checkAnswer(btn, opt === q.correct);
      container.appendChild(btn);
    });
  }

  function checkAnswer(btn, isCorrect) {
    const q = questions[currentIndex];
    if (isCorrect) {
      btn.classList.add('correct'); score += 10; updateStatus();
      Array.from(document.getElementsByClassName('btn-opt')).forEach(b => b.onclick = null);
      setTimeout(() => { currentIndex++; updateStatus(); renderQuestion(); }, 550);
    } else {
      btn.classList.add('disabled'); btn.onclick = null; lives--; updateStatus();
      document.getElementById('lbl-hint').innerText = "💡 Hướng dẫn: " + q.hint;
      if (lives <= 0) endGame(false);
    }
  }

  function endGame(isWin) {
    document.getElementById('quiz-section').classList.add('hidden');
    document.getElementById('end-section').classList.remove('hidden');
    const title = document.getElementById('lbl-end-title');
    const msg = document.getElementById('lbl-end-msg');
    if (isWin) {
      title.innerText = "🎉 XUẤT SẮC! 🎉"; title.style.color = "#0284c7";
      msg.innerText = `Bé đã làm đúng tất cả 20 câu Bài 16 với ${score} điểm!`;
    } else {
      title.innerText = "CỐ GẮNG LẦN SAU NHÉ! 💪"; title.style.color = "#ef4444";
      msg.innerText = `Bé đã vượt qua ${currentIndex}/${questions.length} câu với ${score} điểm.`;
    }
  }

  updateStatus(); renderQuestion();
</script>
</body>
</html>
